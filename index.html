<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e28;
    --border: #252a38;
    --accent: #c8ff00;
    --accent2: #00c8ff;
    --red: #ff4455;
    --green: #00e887;
    --text: #e8ecf4;
    --muted: #5a6070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; }

  /* HEADER */
  header {
    position:sticky; top:0; z-index:100;
    background:rgba(10,12,16,.93); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px;
    padding:0 16px; height:68px;
  }
  .h-logo { width:46px; height:46px; flex-shrink:0; }
  .h-logo img { width:100%; height:100%; object-fit:contain; }
  .h-titles { flex:1; min-width:0; }
  .h-main {
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(17px,3.8vw,26px);
    letter-spacing:2.5px; color:var(--accent); line-height:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .h-sub {
    font-size:10px; color:var(--muted);
    letter-spacing:1.8px; text-transform:uppercase; margin-top:3px;
  }
  .h-ig {
    display:flex; align-items:center; gap:5px;
    font-size:11px; color:var(--muted); text-decoration:none;
    border:1px solid var(--border); padding:6px 10px; border-radius:6px;
    transition:all .2s; white-space:nowrap; flex-shrink:0;
  }
  .h-ig:hover { border-color:var(--accent2); color:var(--accent2); }
  .h-ig svg { width:13px; height:13px; }

  /* TABS */
  .tabs {
    display:flex; border-bottom:1px solid var(--border);
    background:var(--surface); padding:0 16px;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    padding:13px 18px; font-size:13px; font-weight:500;
    color:var(--muted); cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
    transition:all .2s; letter-spacing:.4px; user-select:none;
  }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  .tab:hover:not(.active) { color:var(--text); }

  /* STATS */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border-bottom:1px solid var(--border); }
  .stat { background:var(--surface); padding:10px 8px; text-align:center; }
  .stat-v { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; line-height:1; }
  .stat-v.g { color:var(--green); }
  .stat-v.r { color:var(--red); }
  .stat-v.a { color:var(--accent); }
  .stat-v.b { color:var(--accent2); }
  .stat-l { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

  /* TOOLBAR */
  .toolbar {
    padding:10px 16px; display:flex; gap:7px; flex-wrap:wrap;
    align-items:center; border-bottom:1px solid var(--border); background:var(--bg);
  }
  .sw { flex:1; min-width:140px; position:relative; }
  .sw svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--muted); pointer-events:none; }
  .si {
    width:100%; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); padding:8px 9px 8px 29px; border-radius:6px;
    font-size:13px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color .2s;
  }
  .si:focus { border-color:var(--accent); }
  .si::placeholder { color:var(--muted); }
  .fb {
    padding:7px 12px; border-radius:6px; border:1px solid var(--border);
    background:var(--surface2); color:var(--muted); font-size:12px;
    font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .2s;
    white-space:nowrap; font-weight:500;
  }
  .fb.fa { border-color:var(--text); color:var(--text); }
  .fb.fh { border-color:var(--green); color:var(--green); }
  .fb.fm { border-color:var(--red); color:var(--red); }
  .fb:hover { border-color:var(--accent); color:var(--accent); }

  /* IO BAR */
  .io { display:flex; gap:7px; padding:9px 16px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
  .io .fb { font-size:11px; padding:6px 12px; }

  /* CONTENT */
  .content { padding:14px 16px; max-width:860px; margin:0 auto; }

  /* SECTION */
  .section { margin-bottom:7px; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .sh {
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; background:var(--surface); cursor:pointer;
    user-select:none; transition:background .15s; gap:10px;
  }
  .sh:hover { background:var(--surface2); }
  .sn { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; color:var(--text); flex:1; }
  .sp { display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .pb { width:70px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .pf { height:100%; background:var(--accent); border-radius:2px; transition:width .4s ease; }
  .pt { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); width:38px; text-align:right; }
  .cv { width:15px; height:15px; color:var(--muted); transition:transform .2s; flex-shrink:0; }
  .cv.open { transform:rotate(180deg); }
  .sb { display:none; border-top:1px solid var(--border); }
  .sb.open { display:block; }

  /* GRID */
  .sg { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px; background:var(--border); }
  .stk {
    background:var(--bg); padding:9px 11px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; transition:background .12s; position:relative;
  }
  .stk:hover { background:var(--surface2); }
  .stk.hi { display:none; }
  .snum { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); width:26px; flex-shrink:0; }
  .sname { flex:1; font-size:11.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sed {
    width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    border-radius:3px; opacity:0; transition:opacity .12s; color:var(--muted); flex-shrink:0;
  }
  .stk:hover .sed { opacity:1; }
  .sed:hover { color:var(--accent2); }
  .sed svg { width:10px; height:10px; }
  .sc {
    width:19px; height:19px; border-radius:50%;
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all .12s;
  }
  .stk.ck .sc { background:var(--green); border-color:var(--green); }
  .stk.cr .sc { background:var(--red); border-color:var(--red); }
  .sc svg { width:10px; height:10px; color:#000; opacity:0; transition:opacity .12s; }
  .stk.ck .sc svg, .stk.cr .sc svg { opacity:1; }

  /* NO RESULTS */
  .nr { padding:36px; text-align:center; color:var(--muted); font-size:13px; display:none; }

  /* MODAL */
  .mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .mo.open { display:flex; }
  .md { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:22px; width:100%; max-width:340px; }
  .md h3 { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:2px; margin-bottom:14px; color:var(--accent); }
  .md input {
    width:100%; background:var(--bg); border:1px solid var(--border);
    color:var(--text); padding:9px 11px; border-radius:6px;
    font-size:13px; font-family:'DM Sans',sans-serif; outline:none; margin-bottom:14px;
  }
  .md input:focus { border-color:var(--accent); }
  .mbs { display:flex; gap:7px; justify-content:flex-end; }
  .btn { padding:8px 16px; border-radius:6px; font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500; cursor:pointer; transition:all .15s; border:none; }
  .bg { background:transparent; border:1px solid var(--border); color:var(--muted); }
  .bg:hover { border-color:var(--text); color:var(--text); }
  .bp { background:var(--accent); color:#000; }
  .bp:hover { opacity:.85; }

  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="si" id="searchInput" type="text" placeholder="Buscar por número o nombre..." oninput="applyFilters()">
  </div>
  <button class="fb fa" id="fAll" onclick="setFilter('all')">Todas</button>
  <button class="fb" id="fHave" onclick="setFilter('have')">Tengo</button>
  <button class="fb" id="fMiss" onclick="setFilter('miss')">Faltan</button>
</div>

<div class="io">
  <button class="fb" onclick="exportData()">Exportar progreso</button>
  <button class="fb" onclick="document.getElementById('impFile').click()">Importar progreso</button>
  <input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div class="content" id="mainContent"></div>
<div class="nr" id="noRes">No se encontraron figuritas.</div>

<div class="mo" id="editModal">
  <div class="md">
    <h3>Editar Figurita</h3>
    <input type="text" id="editInput" placeholder="Nombre de la figurita" maxlength="60">
    <div class="mbs">
      <button class="btn bg" onclick="closeModal()">Cancelar</button>
      <button class="btn bp" onclick="saveEdit()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const SECTIONS = [
  {
    id:'fwc_ini', name:'FWC — Inicio',
    stickers:[
      {n:'FWC 00',name:'FWC 00'},{n:'FWC 1',name:'FWC 1'},{n:'FWC 2',name:'FWC 2'},
      {n:'FWC 3',name:'FWC 3'},{n:'FWC 4',name:'FWC 4'},{n:'FWC 5',name:'FWC 5'},
      {n:'FWC 6',name:'FWC 6'},{n:'FWC 7',name:'FWC 7'},{n:'FWC 8',name:'FWC 8'},
    ]
  },
  {
    id:'extra', name:'Extra',
    stickers:[
      {n:'Extra 1',name:'Extra 1'},{n:'Extra 2',name:'Extra 2'},
      {n:'Extra 3',name:'Extra 3'},{n:'Extra 4',name:'Extra 4'},
    ]
  },
];

// Grupos y selecciones en orden del album
const GRUPOS = [
  { grupo:'A', equipos:[
    {code:'MEX',name:'México'},
    {code:'RSA',name:'Sudáfrica'},
    {code:'KOR',name:'Corea del Sur'},
    {code:'CZE',name:'República Checa'},
  ]},
  { grupo:'B', equipos:[
    {code:'CAN',name:'Canadá'},
    {code:'BIH',name:'Bosnia y Herzegovina'},
    {code:'QAT',name:'Qatar'},
    {code:'SUI',name:'Suiza'},
  ]},
  { grupo:'C', equipos:[
    {code:'BRA',name:'Brasil'},
    {code:'MAR',name:'Marruecos'},
    {code:'HAI',name:'Haití'},
    {code:'SCO',name:'Escocia'},
  ]},
  { grupo:'D', equipos:[
    {code:'USA',name:'Estados Unidos'},
    {code:'PAR',name:'Paraguay'},
    {code:'AUS',name:'Australia'},
    {code:'TUR',name:'Turquía'},
  ]},
  { grupo:'E', equipos:[
    {code:'GER',name:'Alemania'},
    {code:'CUW',name:'Curazao'},
    {code:'CIV',name:'Costa de Marfil'},
    {code:'ECU',name:'Ecuador'},
  ]},
  { grupo:'F', equipos:[
    {code:'NED',name:'Países Bajos'},
    {code:'JPN',name:'Japón'},
    {code:'SWE',name:'Suecia'},
    {code:'TUN',name:'Túnez'},
  ]},
  { grupo:'G', equipos:[
    {code:'BEL',name:'Bélgica'},
    {code:'EGY',name:'Egipto'},
    {code:'IRN',name:'Irán'},
    {code:'NZL',name:'Nueva Zelanda'},
  ]},
  { grupo:'H', equipos:[
    {code:'ESP',name:'España'},
    {code:'CPV',name:'Cabo Verde'},
    {code:'SAU',name:'Arabia Saudita'},
    {code:'URU',name:'Uruguay'},
  ]},
  { grupo:'I', equipos:[
    {code:'FRA',name:'Francia'},
    {code:'SEN',name:'Senegal'},
    {code:'NOR',name:'Noruega'},
    {code:'IRQ',name:'Irak'},
  ]},
  { grupo:'J', equipos:[
    {code:'ARG',name:'Argentina'},
    {code:'DZA',name:'Argelia'},
    {code:'AUT',name:'Austria'},
    {code:'JOR',name:'Jordania'},
  ]},
  { grupo:'K', equipos:[
    {code:'POR',name:'Portugal'},
    {code:'COL',name:'Colombia'},
    {code:'CGO',name:'Congo'},
    {code:'UZB',name:'Uzbekistán'},
  ]},
  { grupo:'L', equipos:[
    {code:'ENG',name:'Inglaterra'},
    {code:'CRO',name:'Croacia'},
    {code:'PAN',name:'Panamá'},
    {code:'GHA',name:'Ghana'},
  ]},
];

// Argentina players
const ARG_PLAYERS = [
  "Emiliano 'Dibu' Martínez","Nahuel Molina","Cristian 'Cuti' Romero",
  "Nicolás Otamendi","Nicolás Tagliafico","Leonardo Balerdi",
  "Rodrigo De Paul","Leandro Paredes","Enzo Fernández",
  "Alexis Mac Allister","Exequiel Palacios","Nico Paz",
  "Franco Mastantuono","Julián Álvarez","Lautaro Martínez",
  "Nicolás González","Giuliano Simeone","Lionel Messi",
];

GRUPOS.forEach(g => {
  g.equipos.forEach(eq => {
    const stickers = [];
    if (eq.code === 'ARG') {
      stickers.push({n:`ARG 1`, name:`ARG 1 — Escudo`});
      stickers.push({n:`ARG 2`, name:`ARG 2 — Foto grupal`});
      ARG_PLAYERS.forEach((p,i) => stickers.push({n:`ARG ${i+3}`, name:p}));
    } else {
      for (let i=1;i<=20;i++) stickers.push({n:`${eq.code} ${i}`, name:`${eq.code} ${i}`});
    }
    SECTIONS.push({id:eq.code.toLowerCase(), name:`Grupo ${g.grupo} — ${eq.name}`, stickers});
  });
});

// FWC museo y Coca-Cola al final
const fwcMuseo = {id:'fwc_museo', name:'FWC — Museo', stickers:[]};
for(let i=9;i<=19;i++) fwcMuseo.stickers.push({n:`FWC ${i}`, name:`FWC ${i}`});
SECTIONS.push(fwcMuseo);

const cc = {id:'coca', name:'Coca-Cola', stickers:[]};
for(let i=1;i<=14;i++) cc.stickers.push({n:`CC ${i}`, name:`CC ${i}`});
SECTIONS.push(cc);

const TOTAL = SECTIONS.reduce((s,sec)=>s+sec.stickers.length,0);

// ── STATE ─────────────────────────────────────────────────────────────────────
let activeTab = 'album';
let activeFilter = 'all';
let searchQ = '';
let editTarget = null;
const openSecs = new Set([0,1,2]);

function storeKey() { return activeTab==='album'?'wc26_alb':'wc26_rep'; }
function nameKey()  { return 'wc26_names'; }
function loadChecked() { try{return JSON.parse(localStorage.getItem(storeKey()))||{};}catch{return{};} }
function saveChecked(d){ localStorage.setItem(storeKey(),JSON.stringify(d)); }
function loadNames()   { try{return JSON.parse(localStorage.getItem(nameKey()))||{};}catch{return{};} }
function saveNames(d)  { localStorage.setItem(nameKey(),JSON.stringify(d)); }
function getDisplayName(s){ const n=loadNames(); return n[s.n]!==undefined?n[s.n]:s.name; }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  updateStats();
  const checked=loadChecked();
  const q=searchQ.toLowerCase();
  const content=document.getElementById('mainContent');
  const noRes=document.getElementById('noRes');
  let html=''; let total=0;

  SECTIONS.forEach((sec,si)=>{
    const filtered=sec.stickers.filter(s=>{
      const name=getDisplayName(s);
      const ms=!q||String(s.n).toLowerCase().includes(q)||name.toLowerCase().includes(q);
      const ck=!!checked[s.n];
      const mf=activeFilter==='all'||(activeFilter==='have'&&ck)||(activeFilter==='miss'&&!ck);
      return ms&&mf;
    });
    if(!filtered.length) return;
    total+=filtered.length;
    const have=sec.stickers.filter(s=>!!checked[s.n]).length;
    const tot=sec.stickers.length;
    const pct=Math.round((have/tot)*100);
    const isOpen=openSecs.has(si);
    html+=`
    <div class="section" id="sec-${si}">
      <div class="sh" onclick="toggleSec(${si})">
        <span class="sn">${sec.name}</span>
        <div class="sp">
          <div class="pb"><div class="pf" style="width:${pct}%"></div></div>
          <span class="pt">${have}/${tot}</span>
        </div>
        <svg class="cv ${isOpen?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="sb ${isOpen?'open':''}">
        <div class="sg">`;
    filtered.forEach(s=>{
      const ck=!!checked[s.n];
      const cls=ck?(activeTab==='album'?'ck':'cr'):'';
      const name=getDisplayName(s);
      html+=`
        <div class="stk ${cls}" id="stk-${CSS.escape(s.n)}" onclick="toggleStk('${s.n.replace(/'/g,"\\'")}')">
          <span class="snum">${s.n}</span>
          <span class="sname" title="${name}">${name}</span>
          <span class="sed" onclick="openEdit(event,'${s.n.replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </span>
          <div class="sc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>`;
    });
    html+=`</div></div></div>`;
  });

  content.innerHTML=html;
  noRes.style.display=total===0?'block':'none';
}

function toggleSec(si){
  if(openSecs.has(si)) openSecs.delete(si); else openSecs.add(si);
  render();
}

function updateStats(){
  const ch=loadChecked();
  const have=Object.keys(ch).length;
  const miss=TOTAL-have;
  const pct=Math.round((have/TOTAL)*100);
  document.getElementById('sHave').textContent=have;
  document.getElementById('sMiss').textContent=miss;
  document.getElementById('sTotal').textContent=TOTAL;
  document.getElementById('sPct').textContent=pct+'%';
}

function toggleStk(n){
  const ch=loadChecked();
  if(ch[n]) delete ch[n]; else ch[n]=1;
  saveChecked(ch);
  updateStats();
  const id='stk-'+CSS.escape(n);
  const el=document.getElementById(id);
  if(!el) return;
  const cls=activeTab==='album'?'ck':'cr';
  ch[n]?el.classList.add(cls):el.classList.remove(cls);
  const sec=el.closest('.section');
  if(!sec) return;
  const si=parseInt(sec.id.replace('sec-',''));
  const section=SECTIONS[si];
  if(!section) return;
  const have=section.stickers.filter(s=>!!loadChecked()[s.n]).length;
  const tot=section.stickers.length;
  const pct=Math.round((have/tot)*100);
  sec.querySelector('.pf').style.width=pct+'%';
  sec.querySelector('.pt').textContent=`${have}/${tot}`;
}

function switchTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',(i===0&&t==='album')||(i===1&&t==='rep'));
  });
  applyFilters();
}

function setFilter(f){
  activeFilter=f;
  document.getElementById('fAll').className='fb'+(f==='all'?' fa':'');
  document.getElementById('fHave').className='fb'+(f==='have'?' fh':'');
  document.getElementById('fMiss').className='fb'+(f==='miss'?' fm':'');
  render();
}

function applyFilters(){
  searchQ=document.getElementById('searchInput').value;
  render();
}

function openEdit(e,n){
  e.stopPropagation();
  editTarget=n;
  const s=SECTIONS.flatMap(x=>x.stickers).find(x=>x.n===n);
  document.getElementById('editInput').value=getDisplayName(s);
  document.getElementById('editModal').classList.add('open');
  setTimeout(()=>document.getElementById('editInput').focus(),50);
}
function closeModal(){ document.getElementById('editModal').classList.remove('open'); editTarget=null; }
function saveEdit(){
  if(!editTarget) return;
  const v=document.getElementById('editInput').value.trim();
  if(!v) return;
  const names=loadNames(); names[editTarget]=v; saveNames(names);
  closeModal(); render();
}
document.getElementById('editInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') saveEdit();
  if(e.key==='Escape') closeModal();
});
document.getElementById('editModal').addEventListener('click',e=>{
  if(e.target===document.getElementById('editModal')) closeModal();
});

function exportData(){
  const data={
    album:JSON.parse(localStorage.getItem('wc26_alb')||'{}'),
    rep:JSON.parse(localStorage.getItem('wc26_rep')||'{}'),
    names:JSON.parse(localStorage.getItem('wc26_names')||'{}'),
    at:new Date().toISOString(), v:2
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='album_mundial2026.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.album) localStorage.setItem('wc26_alb',JSON.stringify(d.album));
      if(d.rep)   localStorage.setItem('wc26_rep',JSON.stringify(d.rep));
      if(d.names) localStorage.setItem('wc26_names',JSON.stringify(d.names));
      render(); alert('Progreso importado correctamente.');
    }catch{ alert('Archivo inválido.'); }
  };
  r.readAsText(f); ev.target.value='';
}

render();
</script>
</body>
</html>
